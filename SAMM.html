<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Icons · Image Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 🖼️ Background image with a soft dark overlay for readability */
      background: 
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.65)),
        url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=2070&auto=format&fit=crop') 
        no-repeat center center / cover fixed;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 20px;
      position: relative;
    }

    /* ---------- TOP‑LEFT NAVIGATION ---------- */
    .top-nav {
      position: fixed;
      top: 28px;
      left: 28px;
      display: flex;
      gap: 12px;
      z-index: 100;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      color: #1e1e2f;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
      cursor: pointer;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      fill: #1e1e2f;
      transition: fill 0.2s;
    }

    .nav-btn:hover {
      background: #fff;
      transform: translateY(-3px);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.35);
    }

    .nav-btn:active {
      transform: translateY(0);
    }

    /* Small icon‑only style for back arrow */
    .nav-btn.icon-only {
      padding: 10px 16px;
    }

    /* ---------- SOCIAL WRAPPER ---------- */
    .social-wrapper {
      text-align: center;
      background: rgba(10, 10, 20, 0.35);   /* subtle dark glass panel */
      backdrop-filter: blur(8px);
      padding: 50px 40px 55px;
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
      max-width: 800px;
      width: 100%;
      animation: fadeUp 0.8s cubic-bezier(0.15, 0.9, 0.25, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .social-wrapper h2 {
      color: #fff;
      font-size: 22px;
      margin-bottom: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.95;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
      font-weight: 400;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    /* ---------- Base Icon Style ---------- */
    .social-icon {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.35s ease;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .social-icon svg {
      width: 30px;
      height: 30px;
      z-index: 2;
      transition: fill 0.35s ease, transform 0.35s ease;
      fill: #2d2d44;
    }

    /* Colored background layer that slides up on hover */
    .social-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transform: scale(0);
      transition: transform 0.4s ease;
      z-index: 1;
    }

    .social-icon:hover {
      transform: translateY(-8px) scale(1.08);
    }

    .social-icon:hover::before {
      transform: scale(1);
    }

    .social-icon:hover svg {
      fill: #fff;
      transform: scale(1.15);
    }

    /* ---------- Brand Colors ---------- */
    .whatsapp::before { background: #25D366; }
    .whatsapp:hover    { box-shadow: 0 14px 28px rgba(37, 211, 102, 0.65); }

    .facebook::before { background: #1877F2; }
    .facebook:hover    { box-shadow: 0 14px 28px rgba(24, 119, 242, 0.65); }

    .tiktok::before { background: #000; }
    .tiktok:hover    { box-shadow: 0 14px 28px rgba(0, 0, 0, 0.75); }

    .instagram::before {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .instagram:hover { box-shadow: 0 14px 28px rgba(220, 39, 67, 0.65); }

    .email::before { background: #EA4335; }
    .email:hover    { box-shadow: 0 14px 28px rgba(234, 67, 53, 0.65); }

    .phone::before { background: #34A853; }
    .phone:hover    { box-shadow: 0 14px 28px rgba(52, 168, 83, 0.65); }

    /* ---------- Tooltip Labels ---------- */
    .social-icon::after {
      content: attr(data-name);
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.3px;
    }

    .social-icon:hover::after {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    /* ---------- Size Variants (kept for compatibility) ---------- */
    .social-icons.small .social-icon { width: 46px; height: 46px; }
    .social-icons.small .social-icon svg { width: 22px; height: 22px; }

    .social-icons.large .social-icon { width: 80px; height: 80px; }
    .social-icons.large .social-icon svg { width: 38px; height: 38px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      .top-nav {
        top: 18px;
        left: 18px;
        gap: 8px;
      }
      .nav-btn {
        padding: 8px 16px;
        font-size: 13px;
      }
      .nav-btn svg {
        width: 16px;
        height: 16px;
      }
      .social-wrapper {
        padding: 38px 22px 42px;
        border-radius: 28px;
      }
      .social-wrapper h2 {
        font-size: 17px;
        letter-spacing: 2px;
        margin-bottom: 24px;
      }
      .social-icons {
        gap: 16px;
      }
      .social-icon {
        width: 54px;
        height: 54px;
      }
      .social-icon svg {
        width: 25px;
        height: 25px;
      }
      .social-icon::after {
        bottom: -34px;
        font-size: 11px;
        padding: 5px 10px;
      }
    }

    @media (max-width: 420px) {
      .top-nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .nav-btn {
        padding: 6px 14px;
        font-size: 12px;
      }
      .social-icon {
        width: 48px;
        height: 48px;
      }
      .social-icon svg {
        width: 22px;
        height: 22px;
      }
      .social-wrapper h2 {
        font-size: 14px;
      }
    }
  </style>
</head>
