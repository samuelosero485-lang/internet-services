<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Secure Access</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    
    <style>
        /* ============================================
                   CSS VARIABLES & RESET
                ============================================ */
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #818CF8;
            --secondary: #EC4899;
            --accent: #06B6D4;
            --success: #10B981;
            --danger: #EF4444;
            --dark: #0F172A;
            --dark-card: #1E293B;
            --gray-800: #334155;
            --gray-700: #475569;
            --gray-500: #94A3B8;
            --gray-300: #CBD5E1;
            --gray-100: #F1F5F9;
            --white: #FFFFFF;
            --shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            --shadow-hover: 0 35px 60px -15px rgba(79, 70, 229, 0.3);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ============================================
                   ANIMATED BACKGROUND
                ============================================ */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            animation: float 25s infinite ease-in-out;
        }

        .bg-animation .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: var(--primary);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-animation .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: var(--secondary);
            bottom: -150px;
            left: -100px;
            animation-delay: -8s;
        }

        .bg-animation .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: var(--accent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -16s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* ============================================
                   LOGIN CONTAINER
                ============================================ */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
                   LOGIN CARD
                ============================================ */
        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 40px 32px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .login-card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* Logo / Brand */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.3);
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--white);
            letter-spacing: -0.5px;
        }

        .brand p {
            color: var(--gray-500);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ============================================
                   FORM
                ============================================ */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-300);
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-500);
            font-size: 16px;
            transition: var(--transition);
            pointer-events: none;
        }

        .form-group .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-500);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            background: none;
            border: none;
            padding: 4px;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: var(--white);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .form-group input::placeholder {
            color: var(--gray-500);
            font-size: 14px;
        }

        .form-group input.error {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        .form-group .error-message {
            font-size: 12px;
            color: var(--danger);
            margin-top: 4px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .form-group .error-message.show {
            display: flex;
        }

        /* ============================================
                   OPTIONS ROW
                ============================================ */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--gray-300);
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            border-radius: 4px;
        }

        .forgot-link {
            color: var(--primary-light);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--white);
        }

        /* ============================================
                   BUTTONS
                ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            position: relative;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(79, 70, 229, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
                   DIVIDER
                ============================================ */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        .divider span {
            color: var(--gray-500);
            font-size: 13px;
            white-space: nowrap;
        }

        /* ============================================
                   SOCIAL BUTTONS
                ============================================ */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .btn-social {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: var(--gray-300);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-social:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }

        .btn-social.google:hover { color: #EA4335; border-color: #EA4335; }
        .btn-social.github:hover { color: #6e7681; border-color: #6e7681; }
        .btn-social.microsoft:hover { color: #00A4EF; border-color: #00A4EF; }

        /* ============================================
                   SIGN UP LINK
                ============================================ */
        .signup-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--gray-500);
        }

        .signup-link a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .signup-link a:hover {
            color: var(--white);
        }

        /* ============================================
                   TOAST NOTIFICATION
                ============================================ */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--dark-card);
            color: var(--white);
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow);
            transform: translateY(120px);
            opacity: 0;
            transition: var(--transition);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.success i { color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.error i { color: var(--danger); }
        .toast.info { border-color: var(--primary); }
        .toast.info i { color: var(--primary); }

        /* ============================================
                   RESPONSIVE
                ============================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
            .brand h1 { font-size: 24px; }
            .social-buttons { grid-template-columns: 1fr; }
            .options-row { flex-direction: column; align-items: flex-start; }
        }

        /* ============================================
                   SUCCESS STATE (after login)
                ============================================ */
        .success-state {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-state .checkmark {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--success);
            margin-bottom: 16px;
            animation: popIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success-state h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .success-state p {
            color: var(--gray-500);
            font-size: 14px;
        }

        /* ============================================
                   DEMO CREDENTIALS
                ============================================ */
        .demo-creds {
            background: rgba(79, 70, 229, 0.06);
            border: 1px solid rgba(79, 70, 229, 0.12);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .demo-creds code {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--gray-300);
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .demo-creds .demo-label {
            font-size: 12px;
            color: var(--gray-500);
        }

        .demo-creds .fill-btn {
            font-size: 11px;
            color: var(--primary-light);
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .demo-creds .fill-btn:hover {
            color: var(--white);
        }
    </style>
</head>
<body>

<!-- ==========================================
ANIMATED BACKGROUND
========================================== -->
<div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
</div>

<!-- ==========================================
LOGIN CONTAINER
========================================== -->
<div class="login-container">

    <div class="login-card">
        <!-- Brand -->
        <div class="brand">
            <div class="logo-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to continue to your account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" autocomplete="off">
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="you@example.com" 
                        required
                        autocomplete="username"
                    />
                </div>
                <div class="error-message" id="emailError">
                    <i class="fas fa-exclamation-circle"></i>
                    Please enter a valid email
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        required
                        autocomplete="current-password"
                        minlength="8"
                    />
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error-message" id="passwordError">
                    <i class="fas fa-exclamation-circle"></i>
                    Password must be at least 8 characters
                </div>
            </div>

            <!-- Options -->
            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" />
                    <span>Remember me</span>
                </label>
                <a href="FORGOT PASSWORD.html" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </span>
                <span class="spinner"></span>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>or continue with</span>
        </div>

        <!-- Social Buttons -->
        <div class="social-buttons">
            <a href="#" class="btn-social google" title="Sign in with Google">
                <i class="fab fa-google"></i>
            </a>
            <a href="#" class="btn-social github" title="Sign in with GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="#" class="btn-social microsoft" title="Sign in with Microsoft">
                <i class="fab fa-microsoft"></i>
            </a>
        </div>

        <!-- Sign Up Link -->
        <div class="signup-link">
            Don't have an account? <a href="cyb.html">Create one now</a>
        </div>

        <!-- Success State (hidden by default) -->
        <div class="success-state" id="successState">
            <div class="checkmark">
                <i class="fas fa-check"></i>
            </div>
            <h2>Login Successful!</h2>
            <p>Redirecting to dashboard...</p>
        </div>
    </div>
</div>

<!-- ==========================================
TOAST NOTIFICATION
========================================== -->
<div class="toast" id="toast">
    <i class="fas fa-info-circle" id="toastIcon"></i>
    <span id="toastMessage">Ready</span>
</div>

<!-- ==========================================
JAVASCRIPT
========================================== -->
<script>
    (function() {
        'use strict';

        // ============================================
        // DOM REFERENCES
        // ============================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const loginBtn = document.getElementById('loginBtn');
        const togglePassword = document.getElementById('togglePassword');
        const rememberMe = document.getElementById('rememberMe');
        const fillDemoBtn = document.getElementById('fillDemoBtn');
        const successState = document.getElementById('successState');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        // ============================================
        // DEMO CREDENTIALS
        // ============================================
        const DEMO_EMAIL = 'admin@softpro.com';
        const DEMO_PASSWORD = 'password123';

        // ============================================
        // TOAST SYSTEM
        // ============================================
        let toastTimeout;

        function showToast(message, type = 'info') {
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            
            toastIcon.className = `fas ${icons[type] || icons.info}`;
            toast.className = `toast ${type}`;
            toastMessage.textContent = message;
            
            // Reset animation
            toast.classList.remove('show');
            clearTimeout(toastTimeout);
            
            // Trigger reflow
            void toast.offsetWidth;
            
            toast.classList.add('show');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================
        // VALIDATION
        // ============================================
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function showError(input, errorElement) {
            input.classList.add('error');
            errorElement.classList.add('show');
        }

        function hideError(input, errorElement) {
            input.classList.remove('error');
            errorElement.classList.remove('show');
        }

        // ============================================
        // FORM SUBMISSION
        // ============================================
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            let isValid = true;

            // Validate Email
            if (!validateEmail(email)) {
                showError(emailInput, emailError);
                isValid = false;
            } else {
                hideError(emailInput, emailError);
            }

            // Validate Password
            if (!validatePassword(password)) {
                showError(passwordInput, passwordError);
                isValid = false;
            } else {
                hideError(passwordInput, passwordError);
            }

            if (!isValid) {
                showToast('Please fix the errors before continuing', 'error');
                return;
            }

            // Simulate login
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;

                // Check credentials
                if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
                    // Success
                    form.style.display = 'none';
                    successState.style.display = 'block';
                    showToast('Login successful! Welcome back!', 'success');
                    
                    // Save remember me
                    if (rememberMe.checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    // Simulate redirect
                    setTimeout(() => {
                        showToast('Redirecting to dashboard...', 'info');
                    }, 1500);
                    
                } else {
                    // Failed
                    showToast('Invalid email or password. Please try again.', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }, 1500);
        });

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = this.querySelector('i');
            icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // ============================================
        // FILL DEMO CREDENTIALS
        // ============================================
        fillDemoBtn.addEventListener('click', function() {
            emailInput.value = DEMO_EMAIL;
            passwordInput.value = DEMO_PASSWORD;
            hideError(emailInput, emailError);
            hideError(passwordInput, passwordError);
            showToast('Demo credentials filled! Click Sign In.', 'success');
            
            // Animate the button
            this.innerHTML = '<i class="fas fa-check"></i> Filled!';
            setTimeout(() => {
                this.innerHTML = '<i class="fas fa-pen"></i> Fill';
            }, 2000);
        });

        // ============================================
        // REMEMBER ME - Load saved email
        // ============================================
        const rememberedEmail = localStorage.getItem('rememberedEmail');
        if (rememberedEmail) {
            emailInput.value = rememberedEmail;
            rememberMe.checked = true;
        }

        // ============================================
        // REAL-TIME VALIDATION ON INPUT
        // ============================================
        emailInput.addEventListener('input', function() {
            if (this.value.trim() && validateEmail(this.value.trim())) {
                hideError(this, emailError);
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value && validatePassword(this.value)) {
                hideError(this, passwordError);
            }
        });

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            // Ctrl+Shift+D to fill demo credentials
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                e.preventDefault();
                fillDemoBtn.click();
            }
        });

        // ============================================
        // PREVENT FORM RESUBMISSION ON ENTER
        // ============================================
        form.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.dispatchEvent(new Event('submit'));
            }
        });

        // ============================================
        // FORGOT PASSWORD HANDLER
        // ============================================
        document.querySelector('.forgot-link').addEventListener('click', function(e) {
            e.preventDefault();
            showToast('Password reset link sent to your email', 'info');
        });

        // ============================================
        // SIGN UP LINK HANDLER
        // ============================================
        document.querySelector('.signup-link a').addEventListener('click', function(e) {
            e.preventDefault();
            showToast('Redirecting to sign up page...', 'info');
        });

        // ============================================
        // SOCIAL BUTTON HANDLERS
        // ============================================
        document.querySelectorAll('.btn-social').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const provider = this.classList.contains('google') ? 'Google' :
                                this.classList.contains('github') ? 'GitHub' : 'Microsoft';
                showToast(`Sign in with ${provider} coming soon!`, 'info');
            });
        });

        console.log('%c🔐 Login Page Loaded', 'font-size:18px; font-weight:bold; color:#818CF8;');
        console.log('%c💡 Press Ctrl+Shift+D to fill demo credentials', 'font-size:13px; color:#94A3B8;');

    })();
</script>

</body>
</html>
