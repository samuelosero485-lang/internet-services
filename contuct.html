<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }

  .contact-container {
    background: #fff;
    padding: 40px 35px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 500px;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .contact-container h2 {
    text-align: center;
    color: #333;
    margin-bottom: 8px;
    font-size: 26px;
  }

  .contact-container p.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 28px;
  }

  /* ---------- Form Fields ---------- */
  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    color: #444;
    font-size: 14px;
    font-weight: 600;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.3s, box-shadow 0.3s;
    outline: none;
    background: #fafafa;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    background: #fff;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 110px;
  }

  /* ---------- Submit Button ---------- */
  .submit-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 6px;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.35);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  /* ---------- Divider ---------- */
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 28px 0 20px;
    color: #999;
    font-size: 13px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #e0e0e0;
  }

  .divider span {
    padding: 0 12px;
    font-weight: 600;
  }

  /* ---------- Social Buttons ---------- */
  .social-buttons {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .social-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 50px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.25s, box-shadow 0.25s, filter 0.25s;
  }

  .social-btn svg {
    width: 20px;
    height: 20px;
    fill: #fff;
    flex-shrink: 0;
  }

  .social-btn:hover {
    transform: translateY(-4px) scale(1.04);
    filter: brightness(1.1);
  }

  .whatsapp-btn { background: #25D366; }
  .whatsapp-btn:hover { box-shadow: 0 8px 18px rgba(37, 211, 102, 0.5); }

  .facebook-btn { background: #1877F2; }
  .facebook-btn:hover { box-shadow: 0 8px 18px rgba(24, 119, 242, 0.5); }

  .instagram-btn {
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  }
  .instagram-btn:hover { box-shadow: 0 8px 18px rgba(220, 39, 67, 0.5); }

  /* ---------- Success message ---------- */
  .success-msg {
    display: none;
    background: #e6f9ee;
    color: #1e7e34;
    border: 1px solid #b7ebc6;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    margin-bottom: 18px;
  }

  @media (max-width: 480px) {
    .contact-container { padding: 28px 20px; }
    .social-buttons { flex-direction: column; }
    .social-btn { justify-content: center; }
  }
</style>
</head>
<body>

<div class="contact-container">
  <h2>Get in Touch</h2>
  <p class="subtitle">We'd love to hear from you</p>

  <div class="success-msg" id="successMsg">✓ Message sent successfully!</div>

  <!-- Contact Form -->
  <form id="contactForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="+254 700 000 000">
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Type your message here..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">Send Message</button>
  </form>

  <div class="divider"><span>OR REACH US ON</span></div>

  <!-- Social Media Buttons -->

      WhatsApp
    </a>

    <!-- Facebook -->
    <a href="https://facebook.com/yourpage"

    <!-- Instagram -->
    <a href="https://instagram.com/yourpage"
       target="_blank" rel="noopener" class="social-btn instagram-btn">

      Instagram
    </a>

  </div>
</div>

<script>
  // Handle form submission
  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const phone   = document.getElementById('phone').value.trim();
    const message = document.getElementById('message').value.trim();

    // ---- Option A: Send via WhatsApp ----
    const whatsappNumber = '254700000000'; // <-- CHANGE to your number (country code + number, no + or spaces)
    const waText = encodeURIComponent(
      `*New Contact Message*%0A` +
      `Name: ${name}%0A` +
      `Email: ${email}%0A` +
      `Phone: ${phone}%0A` +
      `Message: ${message}`
    );

    // Uncomment below to auto-forward form to WhatsApp:
    // window.open(`https://wa.me/${whatsappNumber}?text=${waText}`, '_blank');

    // ---- Option B: Just show success message ----
    const successMsg = document.getElementById('successMsg');
    successMsg.style.display = 'block';
    this.reset();

    setTimeout(() => {
      successMsg.style.display = 'none';
    }, 4000);
  });
</script>

</body>
</html>
